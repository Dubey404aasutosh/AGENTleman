    :root {
      --clay-bg: #EEF2F6;
      --shadow-light: #ffffff;
      --shadow-dark: #c1c9d6;
    }

    body {
      background-color: var(--clay-bg);
      color: #2D3748;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Claymorphism Base Styles */
    .clay-card {
      background: #F4F7FA;
      border-radius: 28px;
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light),
        inset 2px 2px 5px rgba(255, 255, 255, 0.9),
        inset -2px -2px 5px rgba(0, 0, 0, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .clay-card:hover {
      transform: translateY(-4px);
      box-shadow: 
        16px 16px 32px var(--shadow-dark),
        -16px -16px 32px var(--shadow-light),
        inset 2px 2px 6px rgba(255, 255, 255, 1),
        inset -2px -2px 6px rgba(0, 0, 0, 0.05);
    }

    .clay-card:active {
      transform: scale(0.97) translateY(0);
      box-shadow: 
        6px 6px 14px var(--shadow-dark),
        -6px -6px 14px var(--shadow-light),
        inset 4px 4px 8px rgba(0, 0, 0, 0.08);
    }

    /* Clay Inset Inputs */
    .clay-input {
      background: #E8EEF5;
      border-radius: 20px;
      box-shadow: 
        inset 4px 4px 8px #c1c9d6,
        inset -4px -4px 8px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      outline: none;
      transition: all 0.2s ease;
    }
    .clay-input:focus {
      box-shadow: 
        inset 5px 5px 10px #b5bdcb,
        inset -5px -5px 10px #ffffff,
        0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Clay Card Variant Colors */
    .clay-purple {
      background: #E6E0FF;
      box-shadow: 12px 12px 24px #cbd0f0, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-peach {
      background: #FFE8DD;
      box-shadow: 12px 12px 24px #e5cac0, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-mint {
      background: #D8F8EE;
      box-shadow: 12px 12px 24px #b8dfd3, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-blue {
      background: #DEEFFF;
      box-shadow: 12px 12px 24px #c2d8ee, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-lemon {
      background: #FFF5CE;
      box-shadow: 12px 12px 24px #e3dab1, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-rose {
      background: #FFE4EE;
      box-shadow: 12px 12px 24px #e5c8d4, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }

    /* Clay Buttons */
    .clay-btn-primary {
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: #ffffff;
      border-radius: 9999px;
      font-weight: 700;
      box-shadow: 
        6px 6px 16px rgba(79, 70, 229, 0.35),
        -4px -4px 12px rgba(255, 255, 255, 0.8),
        inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-primary:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 
        8px 8px 20px rgba(79, 70, 229, 0.45),
        -4px -4px 14px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.5);
    }
    .clay-btn-primary:active {
      transform: scale(0.96);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3);
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    .glass-nav {
      background: rgba(238, 242, 246, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .glass-card-dark {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-delay: -1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        background-attachment: initial !important;
        scroll-behavior: auto !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
      }
      .clay-card, .clay-btn-primary {
        transform: none !important;
      }
    }
  </style>
</head>

    // --- Main Technical Interviewer Dashboard Component ---
    function InterviewDashboardSection() {
      const [selectedCandidateId, setSelectedCandidateId] = useState("CAND-001");
      const [fullCandidatesRaw, setFullCandidatesRaw] = useState([]);
      const [sessionId, setSessionId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [inputValue, setInputValue] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const [isDone, setIsDone] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const [statusText, setStatusText] = useState("");

      const chatBoxRef = useRef(null);

      useEffect(() => {
        fetch("candidates.json")
          .then(res => res.json())
          .then(data => { setFullCandidatesRaw(data.candidates || []); })
          .catch(err => console.error("Could not pre-load candidates.json", err));
      }, []);

      useEffect(() => {
        if (chatBoxRef.current) {
          chatBoxRef.current.scrollTop = chatBoxRef.current.scrollHeight;
        }
      }, [messages, isTyping]);

      const handleStartInterview = async () => {
        const fullCand = fullCandidatesRaw.find(c => c.member && c.member.id === selectedCandidateId);
        const candData = fullCand || { member: { id: selectedCandidateId, name: "Selected Candidate", jobRole: "Engineer" } };

        const newSessionId = "session-" + selectedCandidateId + "-" + Date.now();
        setSessionId(newSessionId);
        setMessages([]);
        setFeedback(null);
        setIsDone(false);
        setIsTyping(true);
        setStatusText("Initializing AI Interviewer state...");

        try {
          const res = await fetch("/api/interview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: newSessionId,
              candidate: candData
            })
          });
          const data = await res.json();
          setIsTyping(false);
          setStatusText("");

          if (res.ok && data.reply) {
            setMessages([{ role: "interviewer", author: "AI Interviewer", text: data.reply }]);
          } else {
            setMessages([{ role: "interviewer", author: "System Error", text: "Error starting interview: " + JSON.stringify(data) }]);
          }
        } catch (err) {
          setIsTyping(false);
          setStatusText("");
          setMessages([{ role: "interviewer", author: "System Error", text: "Network error starting interview: " + err.message }]);
        }
      };

      const handleSendTurn = async () => {
        if (!inputValue.trim() || !sessionId || isTyping || isDone) return;
        const userMsg = inputValue.trim();
        setInputValue("");

        setMessages(prev => [...prev, { role: "candidate", author: "Candidate", text: userMsg }]);
        setIsTyping(true);

        try {
          const res = await fetch("/api/interview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId,
              message: userMsg
            })
          });
          const data = await res.json();
          setIsTyping(false);

          if (res.ok) {
            setMessages(prev => [...prev, { role: "interviewer", author: "AI Interviewer", text: data.reply }]);
            if (data.done) {
              setIsDone(true);
              setFeedback(data.feedback);
            }
          } else {
            setMessages(prev => [...prev, { role: "interviewer", author: "System Error", text: "Error on turn: " + JSON.stringify(data) }]);
          }
        } catch (err) {
          setIsTyping(false);
          setMessages(prev => [...prev, { role: "interviewer", author: "System Error", text: "Network error: " + err.message }]);
        }
      };

      return (
        <section id="interview-app" className="py-20 px-6 max-w-5xl mx-auto">
          <div className="text-center max-w-3xl mx-auto mb-10">
            <span className="clay-card clay-purple px-4 py-1.5 text-xs font-bold text-indigo-900 tracking-widest uppercase inline-block mb-3">
              Phase 6 Submission — Claymorphism UI
            </span>
            <h2 className="font-display font-extrabold text-3xl sm:text-5xl text-slate-900 tracking-tight mb-3">
              AI Cohort Technical Interviewer
            </h2>
            <p className="text-slate-600 text-base sm:text-lg">
              Autonomous 10-turn AI agent evaluating candidate mission mastery in real time.
            </p>
          </div>

          <div className="clay-card p-6 sm:p-10 border-2 border-white shadow-2xl">
            {/* Candidate Selector Header */}
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-200">
              <div className="w-full sm:w-auto flex items-center gap-3">
                <label className="font-bold text-sm text-slate-700 whitespace-nowrap">Select Candidate:</label>
                <select 
                  value={selectedCandidateId}
                  onChange={(e) => setSelectedCandidateId(e.target.value)}
                  className="w-full sm:w-80 px-4 py-2.5 text-sm font-semibold text-slate-800 clay-input rounded-2xl cursor-pointer"
                >
                  {CANDIDATES_DATA.map(c => (
                    <option key={c.id} value={c.id}>
                      {c.id} — {c.name} ({c.jobRole})
                    </option>
                  ))}
                </select>
              </div>

              <button 
                onClick={handleStartInterview}
                className="w-full sm:w-auto clay-btn-primary px-7 py-3 text-sm font-bold flex items-center justify-center gap-2"
              >
                <span>Start Interview Session</span>
              </button>
            </div>

            {/* Chat Conversation Box */}
            <div 
              ref={chatBoxRef}
              className="clay-input p-6 rounded-3xl min-h-[360px] max-h-[500px] overflow-y-auto space-y-6 mb-6 flex flex-col"
            >
              {messages.length === 0 && !isTyping && (
                <div className="m-auto text-center text-slate-400 font-medium py-16">
                  Select a candidate above and click <span className="font-bold text-indigo-600">Start Interview Session</span> to begin the live technical evaluation.
                </div>
              )}

              {messages.map((msg, idx) => (
                <div 
                  key={idx} 
                  className={`flex flex-col ${msg.role === 'candidate' ? 'items-end' : 'items-start'}`}
                >
                  <span className="text-[11px] font-bold text-slate-500 mb-1 px-1">
                    {msg.author}
                  </span>
                  <div 
                    className={`max-w-[85%] p-5 rounded-3xl text-sm leading-relaxed ${
                      msg.role === 'candidate'
                        ? 'clay-card clay-blue text-slate-900 font-medium'
