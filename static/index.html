<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cohort — 31-Day AI Engineering Program</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            clay: {
              bg: '#EEF2F6',
              surface: '#F4F7FA',
              purple: '#E2D9FF',
              peach: '#FFE4D6',
              mint: '#D1F5EA',
              blue: '#D8EEFF',
              lemon: '#FFF3C4',
              rose: '#FFE0EB',
              text: '#2D3748',
              muted: '#64748B',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Framer Motion UMD -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --clay-bg: #EEF2F6;
      --shadow-light: #ffffff;
      --shadow-dark: #c1c9d6;
    }

    body {
      background-color: var(--clay-bg);
      color: #2D3748;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    /* Claymorphism Base Styles */
    .clay-card {
      background: #F4F7FA;
      border-radius: 28px;
      box-shadow: 
        12px 12px 24px var(--shadow-dark),
        -12px -12px 24px var(--shadow-light),
        inset 2px 2px 5px rgba(255, 255, 255, 0.9),
        inset -2px -2px 5px rgba(0, 0, 0, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
    }

    .clay-card:hover {
      transform: translateY(-4px);
      box-shadow: 
        16px 16px 32px var(--shadow-dark),
        -16px -16px 32px var(--shadow-light),
        inset 2px 2px 6px rgba(255, 255, 255, 1),
        inset -2px -2px 6px rgba(0, 0, 0, 0.05);
    }

    .clay-card:active {
      transform: scale(0.97) translateY(0);
      box-shadow: 
        6px 6px 14px var(--shadow-dark),
        -6px -6px 14px var(--shadow-light),
        inset 4px 4px 8px rgba(0, 0, 0, 0.08);
    }

    /* Clay Card Variant Colors */
    .clay-purple {
      background: #E6E0FF;
      box-shadow: 12px 12px 24px #cbd0f0, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-peach {
      background: #FFE8DD;
      box-shadow: 12px 12px 24px #e5cac0, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-mint {
      background: #D8F8EE;
      box-shadow: 12px 12px 24px #b8dfd3, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-blue {
      background: #DEEFFF;
      box-shadow: 12px 12px 24px #c2d8ee, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-lemon {
      background: #FFF5CE;
      box-shadow: 12px 12px 24px #e3dab1, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }
    .clay-rose {
      background: #FFE4EE;
      box-shadow: 12px 12px 24px #e5c8d4, -12px -12px 24px #ffffff, inset 2px 2px 4px rgba(255,255,255,0.9);
    }

    /* Clay Buttons */
    .clay-btn-primary {
      background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
      color: #ffffff;
      border-radius: 9999px;
      font-weight: 700;
      box-shadow: 
        6px 6px 16px rgba(79, 70, 229, 0.35),
        -4px -4px 12px rgba(255, 255, 255, 0.8),
        inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .clay-btn-primary:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 
        8px 8px 20px rgba(79, 70, 229, 0.45),
        -4px -4px 14px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.5);
    }
    .clay-btn-primary:active {
      transform: scale(0.96);
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3);
    }

    /* Glassmorphism Styles */
    .glass-panel {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }

    .glass-nav {
      background: rgba(238, 242, 246, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .glass-card-dark {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    /* Idle floating animations fallback */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(4px); }
    }
    @keyframes floatMedium {
      0%, 100% { transform: translateY(3px); }
      50% { transform: translateY(-5px); }
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-delay: -1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        background-attachment: initial !important;
        scroll-behavior: auto !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
      }
      .clay-card, .clay-btn-primary {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    const FramerMotion = window.Motion || window.FramerMotion;

    // --- Custom SVG Icons for Clay Cards ---
    const IconTooling = () => (

        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>

    const IconVector = () => (

        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>

    const IconAgent = () => (
      <svg className="w-8 h-8 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

    // --- Main Application Component ---
    function App() {
      const { scrollY, scrollYProgress } = useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 100, damping: 30, restDelta: 0.001 });

      // Parallax bindings

      const testimonialParallax2 = useTransform(scrollY, [1400, 2600], [-20, 40]);

                <div className="mt-5 pt-4 border-t border-white/10 flex items-center justify-center gap-6 text-xs text-indigo-200">
